[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lurescope"
version = "0.9.0"
description = "Deployable fraud-lure scoring API with a live adversarial-evasion demo — the serving companion to LureBench."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Imran Ahamed" }]
keywords = ["fraud", "phishing", "detection", "adversarial", "api", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  "cryptography>=42",
  # The bundled joblib model was trained with scikit-learn 1.6.1. Keep the
  # deserializer on the compatible minor line instead of silently loading it in
  # an arbitrary future release.
  "scikit-learn>=1.6,<1.7",
  # Detection + attack logic is reused from the exact public LureBench release
  # so the service and benchmark cannot silently drift. [train] supplies the
  # compatible scikit-learn/joblib runtime for the bundled model.
  "lurebench[train,receipts]==0.10.0",
]

[project.optional-dependencies]
# ruff is pinned: an unpinned linter installs a newer default rule set in CI than
# the one used locally, which is how LureBench's CI went red on a green commit.
dev = ["build>=1.2", "pytest", "httpx", "jsonschema>=4.23", "ruff>=0.15,<0.17"]
# Only needed to render the scorecard heatmap PNG; the markdown/JSON need nothing extra.
viz = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/immu4989/lurescope"
PyPI = "https://pypi.org/project/lurescope/"
Demo = "https://huggingface.co/spaces/immu4989/lurescope"
"GitHub Pages lab" = "https://immu4989.github.io/lurescope/"
Benchmark = "https://github.com/immu4989/lurebench"
Changelog = "https://github.com/immu4989/lurescope/blob/main/CHANGELOG.md"
Issues = "https://github.com/immu4989/lurescope/issues"

[project.scripts]
lurescope = "lurescope.cli:main"

[tool.setuptools]
# Data-only namespace packages are explicit so setuptools does not ambiguously
# infer the model and web-asset directories during wheel builds.
packages = ["lurescope", "lurescope.models", "lurescope.static"]

[tool.setuptools.package-data]
lurescope = [
  "static/*.html",
  "static/*.js",
  "static/*.json",
  "static/*.txt",
  "static/*.webmanifest",
  "static/*.xml",
  "models/*.joblib",
]

[tool.setuptools.data-files]
"share/lurescope/spec" = ["spec/*.json"]

[tool.pytest.ini_options]
# Make the repo root importable so tests can reach the scripts/ helpers.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep typing.Optional/List for conservative pydantic runtime evaluation; UP
# (automatic syntax modernization) is intentionally omitted.
select = ["E", "F", "I", "B"]
