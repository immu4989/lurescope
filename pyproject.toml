[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lurescope"
version = "0.3.0"
description = "Deployable fraud-lure scoring API with a live adversarial-evasion demo — the serving companion to LureBench."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Imran Ahamed" }]
keywords = ["fraud", "phishing", "detection", "adversarial", "api", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2",
  # Detection + attack logic is reused from LureBench so the service and the
  # benchmark can never drift. [train] pulls scikit-learn/joblib for the bundled model.
  "lurebench[train] @ git+https://github.com/immu4989/lurebench.git",
]

[project.optional-dependencies]
# ruff is pinned: an unpinned linter installs a newer default rule set in CI than
# the one used locally, which is how LureBench's CI went red on a green commit.
dev = ["pytest", "httpx", "ruff>=0.15,<0.17"]
# Only needed to render the scorecard heatmap PNG; the markdown/JSON need nothing extra.
viz = ["matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/immu4989/lurescope"
Demo = "https://huggingface.co/spaces/immu4989/lurescope"
Benchmark = "https://github.com/immu4989/lurebench"
Changelog = "https://github.com/immu4989/lurescope/blob/main/CHANGELOG.md"
Issues = "https://github.com/immu4989/lurescope/issues"

[project.scripts]
lurescope = "lurescope.cli:main"

[tool.setuptools]
packages = ["lurescope"]

[tool.setuptools.package-data]
lurescope = ["static/*.html", "models/*.joblib"]

[tool.pytest.ini_options]
# Make the repo root importable so tests can reach the scripts/ helpers.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Targeting 3.9, so keep typing.Optional/List (safest for pydantic runtime eval);
# UP (pyupgrade to 3.10+ syntax) is intentionally omitted.
select = ["E", "F", "I", "B"]
