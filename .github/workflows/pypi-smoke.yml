name: Public PyPI install smoke test

on:
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the public wheel without a source checkout
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          --only-binary=:all: lurescope
      - name: Verify imports, dependency contract, model scoring, and CLI
        run: |
          python -c 'import importlib.metadata as m, lurebench, lurescope; from lurescope.service import score; result=score("Verify your account immediately at hxxps://example[.]invalid"); assert m.version("lurescope") == lurescope.__version__; assert m.version("lurebench") == lurebench.__version__; assert 0.0 <= result.fraud_probability <= 1.0; print({"lurescope": lurescope.__version__, "lurebench": lurebench.__version__, "score": result.fraud_probability})'
          lurescope --help
