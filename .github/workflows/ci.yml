name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.python-version == '3.12'
        with:
          node-version: 24
      - name: Install
        run: uv sync --frozen --python "${{ matrix.python-version }}" --extra dev
      - name: Lint
        run: uv run --frozen ruff check lurescope tests scripts
      - name: Verify content-bound workbench scripts
        run: uv run --frozen python scripts/stamp_static_assets.py --check
      - name: Test
        run: uv run --frozen pytest -q
      - name: Check pinned producer contract without an adjacent checkout
        run: uv run --frozen python scripts/check_producer_contract.py
      - name: Verify transitive authority-verifier independence
        run: uv run --frozen python scripts/verify_mandate_independence.py
      - name: Run locked synthetic Golden Pilot
        if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen python scripts/run_golden_pilot.py
          --out "${RUNNER_TEMP}/lurescope-golden-pilot"
      - name: Run and reverify installable operational pilot
        if: matrix.python-version == '3.12'
        run: |
          uv run --frozen lurescope pilot run \
            --out "${RUNNER_TEMP}/lurescope-operational-pilot"
          uv run --frozen lurescope pilot verify \
            "${RUNNER_TEMP}/lurescope-operational-pilot"
      - name: Validate Federal OSCAL, SCuBA, and drift assurance artifacts
        if: matrix.python-version == '3.12'
        run: >-
          uv run --frozen pytest -q
          tests/test_assurance.py tests/test_scuba.py tests/test_drift.py
      - name: Test browser engine
        if: matrix.python-version == '3.12'
        run: >-
          node --test tests/browser_engine.test.cjs tests/evidence_explorer.test.cjs
          tests/capacity_planner.test.cjs tests/capacity_ui.test.cjs tests/workbench_ui.test.cjs
      - name: Verify browser weights against pinned data-only source
        if: matrix.python-version == '3.12'
        run: uv run --frozen python scripts/export_static_model.py --check
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: uv build
      - name: Check packaged authority code and evidence
        if: matrix.python-version == '3.12'
        run: uv run --frozen python scripts/check_mandate_wheel.py dist/*.whl --package lurescope
      - name: Verify source-distribution browser reproduction inputs
        if: matrix.python-version == '3.12'
        run: uv run --frozen python scripts/check_browser_sdist.py dist/lurescope-*.tar.gz
      - name: Verify installed authority CLI outside the checkout
        if: matrix.python-version == '3.12'
        run: |
          mandate_smoke_root="$(mktemp -d)"
          uv pip install --offline --no-deps --target "$mandate_smoke_root/installed" dist/*.whl
          cd "$mandate_smoke_root"
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed_mandate.py" \
            --package lurescope --installed-root "$mandate_smoke_root/installed"
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/scripts/check_installed_model.py" \
            --installed-root "$mandate_smoke_root/installed"
          node "$GITHUB_WORKSPACE/scripts/check_installed_browser.cjs" \
            "$mandate_smoke_root/installed"

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag lurescope:ci .
      - name: Build source-checkout static Space image
        run: docker build --file Dockerfile.space-ci --tag lurescope-space:ci .
      - name: Start hardened container
        run: |
          docker run --detach --name lurescope-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:8000:8000 \
            --env LURESCOPE_PUBLIC_MODE=true \
            --env 'LURESCOPE_API_KEY_SCRYPT=scrypt$16384$8$1$11111111111111111111111111111111$10db63aeeaa4728a7a3cafe9af0b4d8704e3736c9f74eec4595e69c075f69785' \
            --env LURESCOPE_RATE_LIMIT_PER_MINUTE=10 \
            --env LURESCOPE_PROVIDER_DAILY_LIMIT=0 \
            lurescope:ci
      - name: Verify runtime and API
        run: >-
          python3 scripts/verify_container.py
          --base-url http://127.0.0.1:8000
          --api-key ci-only-lurescope-key-32-characters-minimum
      - name: Verify container isolation
        run: |
          test "$(docker inspect --format '{{.Config.User}}' lurescope-ci)" = "10001:10001"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' lurescope-ci)" = "true"
          docker exec lurescope-ci sh -c '! command -v git'
      - name: Start and verify the static Space privacy boundary
        run: |
          docker run --detach --name lurescope-space-ci \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:17860:7860 \
            lurescope-space:ci
          python3 scripts/verify_static_space.py --base-url http://127.0.0.1:17860
      - name: Validate secure Compose deployment
        env:
          LURESCOPE_API_KEY_SCRYPT: scrypt$16384$8$1$11111111111111111111111111111111$10db63aeeaa4728a7a3cafe9af0b4d8704e3736c9f74eec4595e69c075f69785
          LURESCOPE_PORT: "18080"
        run: |
          docker compose config --quiet
          docker compose up --detach --wait
          python3 scripts/verify_container.py \
            --base-url http://127.0.0.1:18080 \
            --api-key ci-only-lurescope-key-32-characters-minimum
          docker compose down
      - name: Show logs and remove container
        if: always()
        run: |
          docker logs lurescope-ci 2>/dev/null || :
          docker rm --force lurescope-ci 2>/dev/null || :
          docker logs lurescope-space-ci 2>/dev/null || :
          docker rm --force lurescope-space-ci 2>/dev/null || :
          LURESCOPE_API_KEY_SCRYPT=dummy docker compose down 2>/dev/null || :
