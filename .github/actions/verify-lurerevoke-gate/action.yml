name: Verify LureRevoke deployment gate
description: Recompute a LureRevoke gate from its exact topology, telemetry, and signed evidence sources.
author: Imran Ahamed

inputs:
  gate:
    description: Path to the canonical LureRevoke deployment-gate JSON.
    required: true
  topology-audit:
    description: Path to the exact LureRevoke topology-audit JSON.
    required: true
  otel-projection:
    description: Path to the exact body-free OpenTelemetry projection JSON.
    required: true
  evidence-bundle:
    description: Path to the exact signed LureRevoke evidence-bundle directory.
    required: true
  bundle-public-key:
    description: Path to the separately trusted PEM public key for the evidence bundle.
    required: true
  expected-bundle-key-id:
    description: Pinned lowercase SHA-256 key ID from a separately governed trust policy.
    required: true
  maximum-allowed-convergence-ms:
    description: External policy ceiling for the plan's convergence deadline in milliseconds.
    required: true
  minimum-run-generated-at:
    description: Earliest revocation-run timestamp accepted by external release policy.
    required: true
  expected-system-id:
    description: System identity authorized by external deployment policy.
    required: true
  expected-environment:
    description: Environment authorized by external deployment policy.
    required: true
  expected-receiver-name:
    description: Receiver name authorized by external deployment policy.
    required: true
  expected-receiver-artifact-sha256:
    description: Pinned SHA-256 digest of the receiver artifact authorized for deployment.
    required: true
  python-version:
    description: Python runtime used for independent verification.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install the verifier from this pinned action revision
      shell: bash
      env:
        LURESCOPE_ACTION_ROOT: ${{ github.action_path }}/../../..
      run: python -m pip install --disable-pip-version-check -- "$LURESCOPE_ACTION_ROOT"
    - name: Recompute the deployment gate
      shell: bash
      env:
        LURESCOPE_GATE: ${{ inputs.gate }}
        LURESCOPE_TOPOLOGY_AUDIT: ${{ inputs.topology-audit }}
        LURESCOPE_OTEL_PROJECTION: ${{ inputs.otel-projection }}
        LURESCOPE_EVIDENCE_BUNDLE: ${{ inputs.evidence-bundle }}
        LURESCOPE_BUNDLE_PUBLIC_KEY: ${{ inputs.bundle-public-key }}
        LURESCOPE_EXPECTED_BUNDLE_KEY_ID: ${{ inputs.expected-bundle-key-id }}
        LURESCOPE_MAXIMUM_ALLOWED_CONVERGENCE_MS: ${{ inputs.maximum-allowed-convergence-ms }}
        LURESCOPE_MINIMUM_RUN_GENERATED_AT: ${{ inputs.minimum-run-generated-at }}
        LURESCOPE_EXPECTED_SYSTEM_ID: ${{ inputs.expected-system-id }}
        LURESCOPE_EXPECTED_ENVIRONMENT: ${{ inputs.expected-environment }}
        LURESCOPE_EXPECTED_RECEIVER_NAME: ${{ inputs.expected-receiver-name }}
        LURESCOPE_EXPECTED_RECEIVER_ARTIFACT_SHA256: ${{ inputs.expected-receiver-artifact-sha256 }}
      run: >-
        lurescope revoke verify-gate
        "$LURESCOPE_GATE"
        "$LURESCOPE_TOPOLOGY_AUDIT"
        "$LURESCOPE_OTEL_PROJECTION"
        "$LURESCOPE_EVIDENCE_BUNDLE"
        --bundle-public-key "$LURESCOPE_BUNDLE_PUBLIC_KEY"
        --expected-bundle-key-id "$LURESCOPE_EXPECTED_BUNDLE_KEY_ID"
        --maximum-allowed-convergence-ms "$LURESCOPE_MAXIMUM_ALLOWED_CONVERGENCE_MS"
        --minimum-run-generated-at "$LURESCOPE_MINIMUM_RUN_GENERATED_AT"
        --expected-system-id "$LURESCOPE_EXPECTED_SYSTEM_ID"
        --expected-environment "$LURESCOPE_EXPECTED_ENVIRONMENT"
        --expected-receiver-name "$LURESCOPE_EXPECTED_RECEIVER_NAME"
        --expected-receiver-artifact-sha256 "$LURESCOPE_EXPECTED_RECEIVER_ARTIFACT_SHA256"
        --json

branding:
  icon: shield
  color: purple
